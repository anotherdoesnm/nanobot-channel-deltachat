# pyproject.toml

# This is a source tree, not a standalone pip plugin. The channel package
# (`nanobot_channel_deltachat/`) is copied into `nanobot/channels/deltachat/`
# of a nanobot checkout by `patch_nanobot.py`, where the runtime imports and
# dependencies resolve against the nanobot package.
[project]
name = "nanobot-channel-deltachat"
version = "0.1.0"
description = "Delta Chat channel for nanobot"
requires-python = ">=3.11"
dependencies = [
    "deltachat-rpc-client>=2.54.0",
    "deltachat-rpc-server>=2.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
